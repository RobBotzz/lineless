services:
  backend:
    build: ./Backend
    ports:
      - "8000:8000"
    environment:
      MONGO_URI: "mongodb://mongo:27017/lineless?replicaSet=rs0"
      PORT: "8000"
      APP_BASE_URL: "http://localhost:3000"
      JWT_SECRET: "REPLACE_WITH_A_RANDOM_64_CHAR_HEX_JWT_SECRET"
      RESEND_API_KEY: "re_REPLACE_WITH_YOUR_RESEND_API_KEY"
      RESEND_FROM_ADDRESS: "contact@lineless.shop"
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./Frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  #TODO: Entfernen vor der Abgabe
  mongo-express:
    image: mongo-express:1.0.2
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: "mongodb://mongo:27017/?replicaSet=rs0"
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }",
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

volumes:
  mongo-data:
