services:
  backend:
    build: ./Backend
    ports:
      - "8000:8000"
    environment:
      MONGO_URI: "mongodb://mongo:27017/lineless?replicaSet=rs0"
      PORT: "8000"
      APP_BASE_URL: "http://localhost:3000"
      JWT_SECRET: "REPLACE_WITH_A_RANDOM_64_CHAR_HEX_JWT_SECRET"
      RESEND_API_KEY: "re_REPLACE_WITH_YOUR_RESEND_API_KEY"
      RESEND_FROM_ADDRESS: "contact@lineless.shop"
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  # Forwards live Stripe webhook events to the backend (POST /webhooks/stripe)
  # so card holds get authorized and tabs move to OPEN. Authenticates with the
  # committed test key, so teammates need no Stripe login of their own. The
  # listen signing secret for this account is the whsec_ in Backend config, so
  # signature verification passes. Requires internet access to Stripe.
  stripe-cli:
    image: stripe/stripe-cli:latest
    command:
      [
        "listen",
        "--api-key",
        "sk_test_REPLACE_WITH_YOUR_STRIPE_TEST_SECRET_KEY",
        "--forward-to",
        "backend:8000/webhooks/stripe",
      ]
    depends_on:
      - backend
    restart: unless-stopped

  frontend:
    build: ./Frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }",
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

volumes:
  mongo-data:
