services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      MONGO_URI: "mongodb://mongo:27017/lineless?replicaSet=rs0"
      PORT: "8000"
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Initiate the replica set on first start (idempotent); healthy once primary.
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }",
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

volumes:
  mongo-data:
