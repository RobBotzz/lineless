info:
  name: login operator
  type: http
  seq: 1

http:
  method: POST
  url: http://{{host}}:{{port}}/api/operator/login
  body:
    type: json
    data: |-
      {
        "standId": "{{standId}}",
        "accessPassword": "secret123"
      }
  auth:
    type: none

script:
  res: |
    if (res.status === 200 && res.body.token) {
      bru.setVar("operatorToken", res.body.token);
    }

tests: |
  test("operator login returns stand-scoped token", function () {
    expect(res.status).to.equal(200);
    expect(res.body.token).to.be.a("string").and.not.empty;
    expect(res.body.standId).to.equal(bru.getVar("standId"));
  });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
