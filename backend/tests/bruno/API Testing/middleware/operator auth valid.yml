info:
  name: operator auth valid
  type: http
  seq: 9

http:
  method: GET
  url: http://{{host}}:{{port}}/api/stands/{{standId}}
  auth:
    type: none
  headers:
    - name: Authorization
      value: Bearer {{operatorToken}}
      enabled: true

tests: |
  test("valid operator token is accepted", function () {
    expect(res.status).to.equal(200);
  });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
