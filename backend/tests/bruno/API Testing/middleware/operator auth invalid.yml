info:
  name: operator auth invalid
  type: http
  seq: 8

http:
  method: GET
  url: http://{{host}}:{{port}}/api/stands/{{standId}}
  auth:
    type: none
  headers:
    - name: Authorization
      value: Bearer invalid-operator-token
      enabled: true

tests: |
  test("invalid operator token is rejected", function () {
    expect(res.status).to.equal(401);
  });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
