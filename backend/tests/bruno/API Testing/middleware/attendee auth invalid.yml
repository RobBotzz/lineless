info:
  name: attendee auth invalid
  type: http
  seq: 5

http:
  method: GET
  url: http://{{host}}:{{port}}/api/events/{{eventId}}
  auth:
    type: none
  headers:
    - name: X-Attendee-Session-ID
      value: 00000000-0000-4000-8000-000000000000
      enabled: true

tests: |
  test("invalid attendee session is rejected", function () {
    expect(res.status).to.equal(401);
  });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
