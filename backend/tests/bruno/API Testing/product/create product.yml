info:
  name: create product
  type: http
  seq: 1

http:
  method: POST
  url: http://{{host}}:{{port}}/api/stands/{{standId}}/products
  body:
    type: json
    data: |-
      {
        "productName": "Cola",
        "productDescription": "Refreshing soft drink",
        "priceExclTax": 250,
        "taxRate": 0.19,
        "productImageUrl": "https://example.com/cola.png",
        "instantProduct": false,
        "productStock": 100
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
