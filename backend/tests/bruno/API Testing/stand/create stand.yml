info:
  name: create stand
  type: http
  seq: 1

http:
  method: POST
  url: http://{{host}}:{{port}}/api/events/{{eventId}}/stands
  body:
    type: json
    data: |-
      {
        "standName": "Beer Stand",
        "accessPassword": "secret123",
        "locationName": "North Gate",
        "xCoordinate": 10.5,
        "yCoordinate": 20.3
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
