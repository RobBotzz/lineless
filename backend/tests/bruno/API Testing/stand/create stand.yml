info:
  name: create stand
  type: http
  seq: 1

http:
  method: POST
  url: http://{{host}}:{{port}}/events/{{eventId}}/stands
  headers:
    - name: Authorization
      value: Bearer {{token}}
      enabled: true
  body:
    type: json
    data: |-
      {
        "standName": "Beer Stand",
        "accessPassword": "secret123",
        "location": "North Gate"
      }
  auth: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
