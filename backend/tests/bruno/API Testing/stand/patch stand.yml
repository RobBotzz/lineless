info:
  name: patch stand
  type: http
  seq: 4

http:
  method: PATCH
  url: http://{{host}}:{{port}}/events/{{eventId}}/stands/{{standId}}
  headers:
    - name: Authorization
      value: Bearer {{token}}
      enabled: true
  body:
    type: json
    data: |-
      {
        "standName": "Beer & Wine Stand",
        "location": "South Gate"
      }
  auth: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
