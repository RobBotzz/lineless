info:
  name: patch stand
  type: http
  seq: 4

http:
  method: PATCH
  url: http://{{host}}:{{port}}/api/events/{{eventId}}/stands/{{standId}}
  body:
    type: json
    data: |-
      {
        "standName": "Beer & Wine Stand",
        "locationName": "South Gate",
        "xCoordinate": 15.0,
        "yCoordinate": 25.0
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
