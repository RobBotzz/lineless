info:
  name: get stand
  type: http
  seq: 3

http:
  method: GET
  url: http://{{host}}:{{port}}/stands/{{standId}}
  headers:
    - name: Authorization
      value: Bearer {{token}}
      enabled: true
  auth: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
