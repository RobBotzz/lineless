info:
  name: list stands
  type: http
  seq: 2

http:
  method: GET
  url: http://{{host}}:{{port}}/events/{{eventId}}/stands
  headers:
    - name: Authorization
      value: Bearer {{token}}
      enabled: true
  auth: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
