info:
  name: list events
  type: http
  seq: 1

http:
  method: GET
  url: http://{{address}}:{{port}}/api/events
  auth: inherit

runtime:
  variables:
    - name: port
      value: "8000"
    - name: address
      value: localhost

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
