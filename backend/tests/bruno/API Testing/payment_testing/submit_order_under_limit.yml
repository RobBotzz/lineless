info:
  name: 3. Submit Order (Under Limit)
  type: http
  seq: 3

# Expects 201. The order value stays within the authorized baseline hold,
# so the items are released immediately (startedAt set).
# POST /orders requires a JWT (authAccount middleware).

http:
  method: POST
  url: http://{{host}}:{{port}}/orders
  headers:
    - name: Authorization
      value: Bearer {{authToken}}
  body:
    type: json
    data: |-
      {
        "tabId": "{{tabId}}",
        "items": [
          {
            "productId": "{{productId}}",
            "quantity": 1
          }
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
