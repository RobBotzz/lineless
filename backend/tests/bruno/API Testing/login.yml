info:
  name: login
  type: http
  seq: 2

http:
  method: POST
  url: http://{{host}}:{{port}}/api/account/login
  body:
    type: json
    data: |-
      {
        "email": "testuser@example.com",
        "password": "SecurePassword123"
      }
  auth: inherit

script:
  res: |
    if (res.status === 200 && res.body.token) {
      bru.setVar("token", res.body.token);
    }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
