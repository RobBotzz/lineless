opencollection: 1.0.0

info:
  name: API Testing
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  auth:
    type: bearer
    token: "{{organizerToken}}"
  variables:
    - name: host
      value: localhost
    - name: port
      value: "8000"
    - name: organizerToken
      value: ""
    - name: operatorToken
      value: ""
    - name: attendeeSessionId
      value: ""
    - name: eventId
      value: 079b834d-e39e-4f53-b170-aff1cd1047bf
    - name: standId
      value: 0623dd8e-2ea8-46a4-9a66-5dbf24572c9e
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
