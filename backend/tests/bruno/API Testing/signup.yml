info:
  name: signup
  type: http
  seq: 1

http:
  method: POST
  url: http://{{host}}:{{port}}/api/account/signup
  body:
    type: json
    data: |-
      {
        "email": "testuser@example.com",
        "password": "SecurePassword123",
        "firstName": "Max",
        "lastName": "Mustermann"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
