info:
  name: login
  type: http
  seq: 2

http:
  method: POST
  url: http://{{host}}:{{port}}/api/account/login
  body:
    type: json
    data: |-
      {
        "email": "torben@test.de",
        "password": "1234567a"
      }
  auth:
    type: none

script:
  res: |
    if (res.status === 200 && res.body.token) {
      bru.setVar("organizerToken", res.body.token);
    }

tests: |
  test("login returns organizer token", function () {
    expect(res.status).to.equal(200);
    expect(res.body.token).to.be.a("string").and.not.empty;
  });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
