info:
  name: signup
  type: http
  seq: 1

http:
  method: POST
  url: http://{{host}}:{{port}}/api/account/signup
  body:
    type: json
    data: |-
      {
        "email": "testuser@example.com",
        "password": "SecurePassword123",
        "firstName": "Max",
        "lastName": "Mustermann"
      }
  auth:
    type: none

script:
  res: |
    if (res.status === 201 && res.body.token) {
      bru.setVar("organizerToken", res.body.token);
    }

tests: |
  test("signup either creates organizer or reports existing account", function () {
    expect([201, 409]).to.include(res.status);
  });
  if (res.status === 201) {
    test("signup returns organizer token", function () {
      expect(res.body.token).to.be.a("string").and.not.empty;
    });
  }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
