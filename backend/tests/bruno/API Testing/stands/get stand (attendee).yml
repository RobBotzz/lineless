info:
  name: get stand (attendee)
  type: http
  seq: 8

http:
  method: GET
  url: http://{{host}}:{{port}}/api/stands/{{standId}}
  auth:
    type: none
  headers:
    - name: X-Attendee-Session-ID
      value: "{{attendeeSessionId}}"
      enabled: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
