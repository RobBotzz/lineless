info:
  name: get event (attendee)
  type: http
  seq: 2

http:
  method: GET
  url: http://{{host}}:{{port}}/api/events/{{eventId}}
  auth:
    type: none
  headers:
    - name: Cookie
      value: sessionId=test-session
      enabled: true

tests: |
  test("attendee can read event", function () {
    expect(res.status).to.equal(200);
  });
  test("event exposes location", function () {
    expect(res.body).to.have.property("location");
  });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
