info:
  name: get location (attendee)
  type: http
  seq: 3

http:
  method: GET
  url: http://{{host}}:{{port}}/api/events/{{eventId}}/location
  auth:
    type: none
  headers:
    - name: Cookie
      value: sessionId=test-session
      enabled: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
