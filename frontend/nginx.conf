server {
  listen 3000;

  # Proxy API calls to the backend service. The frontend uses relative /api
  # paths (see src/api/client.ts), so nginx must forward them in Docker — the
  # Vite dev proxy only applies to `npm run dev`, not the built bundle.
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # SSE streams (live order/analytics updates) need buffering off and a long
    # read timeout so the connection is not closed mid-stream.
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  # SPA: serve static assets, fall back to index.html for client-side routes.
  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }
}
